_target_: src.data.joint_prseg_dataset.JointPRSegDataModule

pr_weight: 1.0
seg_weight: 1.0
batch_size: 32
num_workers: 4
pin_memory: true

pr_datamodule:
  _target_: src.data.kaldi_pretraining_dataset.build_kaldi_datamodule
  train_split: "train"
  dev_splits: ["dev_1k"]
  dataset_config_path: configs/data/ipapack_index.yaml
  batch_size: 16
  num_workers: 4
  vocab_file: ${model.net.vocab_file}

seg_datamodule:
  _target_: src.data.segmentation.segmentation_dataset.SegmentationDataModule
  hf_repo: changelinglab/timit-segment
  tokenizer:
    _target_: src.model.xeusphoneme.builders.XeusPRTokenizer
    vocab_file: src/model/xeusphoneme/resources/ipa_vocab.json
  batch_size: 32
  num_workers: 4
  target_sr: 16000
