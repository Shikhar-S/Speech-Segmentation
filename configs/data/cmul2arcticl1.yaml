_target_: src.data.cmu_l2arctic.l1_classification.CmuL2ArcticL1Classification
data_dir: ${paths.exp_dir}/cmu_l2arctic # Path to data root directory (contains audio files)
metadata_path: ${paths.exp_dir}/cmu_l2arctic_cache/metadata.csv # Path to metadata.csv generated by prepare_cmu_l2arctic_metadata.py
num_classes: 7 # Number of L1 classes
id_to_label: ["ar", "en", "es", "hi", "ko", "vi", "zh"]  # Fixed L1 labels (alphabetical order)
target_sr: 16000
batch_size: 32 # Needs to be divisible by the number of devices (e.g., if in a distributed setup)
num_workers: 10
pin_memory: False
max_duration_sec: 20 # Optional: maximum audio duration in seconds for truncation