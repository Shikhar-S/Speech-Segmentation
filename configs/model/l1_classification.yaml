# L1 Classification model config
# Encoder is injected via model/net group (e.g., override /model/net: powsm or ipa_embedding)
# Head is injected via model/head group (e.g., override /model/head: transformer or rnn)
#
# Two input modes are supported:
# 1. Audio mode (input_type: "audio"): Uses audio encoder (powsm, wav2vec2phoneme)
#    - Data batch contains: speech, speech_length, label
# 2. IPA mode (input_type: "ipa"): Uses IPA embedding
#    - Data batch contains: ipa_ids, lengths, label

defaults:
  - head: transformer  # Default head, can be overridden with /model/head: rnn

_target_: src.recipe.l1_classification.model_module.L1ClassificationModel

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.001
  weight_decay: 0.0

scheduler:
  _target_: torch.optim.lr_scheduler.LinearLR
  _partial_: true
  total_iters: 100
  last_epoch: -1

# Encoder is provided via model/net group
encoder: ${model.net}

# Head configuration is loaded from configs/model/head/*.yaml
# Override input_dim and output_dim here
head:
  input_dim: ${model.encoder_output_dim}
  output_dim: ${model.num_classes}

# Model parameters
num_classes: 7  # L1 classes: ar, en, es, hi, ko, vi, zh
encoder_output_dim: ???  # Must be specified based on encoder (e.g., 256 for powsm, 128 for ipa_embedding)
freeze_encoder: true  # For audio mode; typically false for IPA mode
id_to_label: ["ar", "en", "es", "hi", "ko", "vi", "zh"]  # Fixed L1 labels (alphabetical order)

# Input mode: "audio" for audio encoder, "ipa" for IPA embedding
input_type: "audio"

