# TransformerHead configuration
# Reference: src/model/heads/transformer_head.py

_target_: src.model.heads.transformer_head.TransformerHead
_partial_: true

# Required parameters (must be overridden)
output_dim: ???  # Number of classes for classification

# Transformer architecture
d_model: 256  # Model dimension (input will be projected if different from input_dim)
nhead: 4  # Number of attention heads
num_layers: 2  # Number of Transformer encoder layers
dim_feedforward: 1024  # Feedforward network dimension

# Regularization
dropout: 0.1

# Positional encoding: "sinusoidal", "learnable", or "none"
positional_encoding: "sinusoidal"

# Pooling strategy: "cls", "mean", or "attention"
# - cls: Use [CLS] token (prepended to sequence)
# - mean: Mean pooling over valid timesteps
# - attention: Attention-weighted pooling
pooling: "mean"

# Maximum sequence length for positional encoding
max_seq_len: 5000

# Task type: "classification" or "regression"
task_type: "classification"

