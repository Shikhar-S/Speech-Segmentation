# @package _global_
# English / accented-English MFA baseline: Koel phone recognizer +
# per-utterance mfa align_one (text-independent forced alignment).
# Override data.hf_repo at the command line, e.g.:
#   python src/main.py experiment=segment/mfa_baseline \
#       data.hf_repo=changelinglab/timit-segment
defaults:
  - override /data: segmentation_phonvec
  - override /logger: csv
  - override /model: null
  - override /model/net: null

task_name: "inf_baseline_mfa_en"
tags: ["mfa", "baseline", "inference"]

train: false
test: false
distributed_predict: True

data:
  hf_repo: ${oc.env:SEG_REPO_TIMIT,changelinglab/timit-segment}
  predict_split: test

inference:
  num_workers: 16
  batch_size: 1
  limit_samples: null
  out_file: ${paths.output_dir}/baseline_mfa_en.jsonl
  passthrough_keys:
    - utt_id
    - phone_timestamps
    - phones
    - split
  inference_runner:
    _target_: src.model.mfa.inference_baseline.build_mfa_single_inference
    dictionary: english_mfa
    acoustic_model: english_mfa
    sr: 16000
    cache_dir: ${paths.cache_dir}/mfa
    phone_normalizer: koel
    recognizer:
      _target_: src.model.koel.builders.build_koel_inference
      hf_repo: KoelLabs/xlsr-english-01
      device: cuda
      dtype: float32
      cache_dir: ${paths.cache_dir}/hf
