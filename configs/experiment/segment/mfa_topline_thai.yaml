# @package _global_
# Thai MFA topline: per-utterance text-dependent forced alignment using GT
# phones from gTIMIT-Thai (no recognizer), aligned with the thai_mfa acoustic
# model.
#   python src/main.py experiment=segment/mfa_topline_thai \
#       data.hf_repo=changelinglab/gtimit-tha-segment
defaults:
  - override /data: segmentation_phonvec
  - override /logger: csv
  - override /model: null
  - override /model/net: null

task_name: "inf_topline_mfa_thai"
tags: ["mfa", "topline", "thai", "inference"]

train: false
test: false
distributed_predict: True

data:
  hf_repo: ${oc.env:SEG_REPO_GTIMIT_THA,changelinglab/gtimit-tha-segment}
  predict_split: test
  # The registry default for gtimit-tha is the TONELESS transform; override to
  # the tone-fusing one (reads the row's `tones` field) so vowels carry tone.
  transform:
    _target_: src.data.segmentation.dataset_processing_transforms.process_gtimit_thai_with_tones
    _partial_: true

inference:
  num_workers: 16
  batch_size: 1
  limit_samples: null
  out_file: ${paths.output_dir}/topline_mfa_thai.jsonl
  passthrough_keys:
    - utt_id
    - phone_timestamps
    - phones
    - split
  inference_runner:
    _target_: src.model.mfa.inference_baseline.build_mfa_single_inference
    dictionary: thai_mfa
    acoustic_model: thai_mfa
    sr: 16000
    cache_dir: ${paths.cache_dir}/mfa
    phone_normalizer: thai_mfa
    # thai_mfa (CommonVoice/MFA) is a weaker acoustic match than english_mfa is
    # for the English sets; widen the beam to avoid "Could not align ... with
    # the current beam size" hard failures (cf. tamil_cv on SSNCE).
    beam: 100
    retry_beam: 400
    recognizer: null
