# @package _global_

# to execute this experiment run:
# python src/main.py experiment=powsmvr_timit_fa

defaults:
  - override /data: timit
  - override /model: forced_alignment
  - override /model/net: powsm_vr
  - override /data/tokenizer: powsm
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: wandb

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

task_name: "powsmvr_timit_fa"
tags: ["powsmvr_timit_fa"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 10
  gradient_clip_val: 1.0
  val_check_interval: 0.25 # validate 4 times per epoch
  callbacks:
    - learning_rate_monitor

model:
  optimizer:
    lr: 0.0002
  # freeze_encoder: true TODO(shikhar): implement (?)

data:
  batch_size: 48

logger:
  wandb:
    tags: ${tags}
    group: "powsmvr_timit_fa"
  aim:
    experiment: "powsmvr_timit_fa"  