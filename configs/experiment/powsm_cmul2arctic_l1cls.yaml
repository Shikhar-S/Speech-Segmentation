# @package _global_

# L1 Classification experiment with POWSM encoder
# To execute this experiment run:
# python src/main.py experiment=powsm_cmul2arctic_l1cls

defaults:
  - override /data: cmu_l2arctic_l1
  - override /model: l1_classification
  - override /model/head: transformer
  - override /model/net: powsm
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: wandb

# TODO(shikhar): add a nesting level to separate out experiment 
# configs for probing, cascade, inference

task_name: "powsm_cmul2arctic_l1cls"
tags: ["powsm",'cmu_l2arctic' ,"l1_classification"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 50
  gradient_clip_val: 1.0
  val_check_interval: 0.25  # validate 4 times per epoch

data:
  batch_size: 32

model:
  freeze_encoder: false
  optimizer:
    lr: 0.0001

logger:
  wandb:
    tags: ${tags}
    group: "l1_classification"