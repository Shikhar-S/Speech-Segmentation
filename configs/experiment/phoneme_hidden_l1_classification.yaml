# @package _global_

# L1 Classification experiment using audio encoder hidden states
# Uses raw audio input with an encoder (e.g., PoWSM, Wav2Vec2Phoneme)
#
# To execute this experiment run:
# python src/main.py experiment=phoneme_hidden_l1_classification
#
# To use different encoders, override model/net:
# python src/main.py experiment=phoneme_hidden_l1_classification model/net=w2v2ph

defaults:
  - override /data: cmu_l2arctic_l1 
  - override /model: l1_classification
  - override /model/net: powsm
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: wandb

task_name: "phoneme_hidden_l1_classification"
tags: ["hidden", "l1_classification", "powsm"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 50
  gradient_clip_val: 1.0
  val_check_interval: 0.25  # validate 4 times per epoch

data:
  data_dir: ${paths.data_dir}
  metadata_path: ${paths.data_dir}/metadata.csv
  batch_size: 32
  num_workers: 4
  target_sr: 16000

model:
  input_type: "audio"
  freeze_encoder: true  # Freeze PoWSM encoder weights
  encoder_output_dim: 768  # PoWSM default
  optimizer:
    lr: 0.0001  # Lower LR for fine-tuning with frozen encoder

logger:
  wandb:
    tags: ${tags}
    group: "l1_classification"






