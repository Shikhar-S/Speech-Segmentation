# @package _global_
# python src/main.py experiment=inference/phonvec_voxangeles \
#     inference.inference_runner.model_name_or_path=...
#
# Predicts on the VoxAngeles 'test' split AFTER the registered split
# transform is applied. This ensures tuning and prediction sets are disjoint.
defaults:
  - override /data: segmentation_phonvec
  - override /logger: csv
  - override /model: null
  - override /model/net: null

task_name: "inf_phonvec_voxangeles"
tags: ["phonvec", "inference", "voxangeles"]

train: false
test: false
distributed_predict: True

data:
  hf_repo: changelinglab/voxangeles-segment
  predict_split: test # Pin to be unambiguous.

inference:
  num_workers: 4
  limit_samples: null
  out_file: ${paths.output_dir}/phonvec_voxangeles.jsonl
  passthrough_keys:
    - "utt_id"
    - "phone_timestamps"
    - "phones"
    - "split"
  inference_runner:
    _target_: src.model.phonvec.inference.build_phonvec_inference
    model_name_or_path: ??? # HuggingFace repo id or local path
    device: cuda
    # Optional vocab constraints forwarded to PhoneModel.recognize:
    # lang: eng
    # phoneme: false
    # dedup: true
