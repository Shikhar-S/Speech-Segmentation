# @package _global_

# This config executes phoneme recognition inference with wav2vec2-phoneme
# python src/main.py experiment=inference/buckeye_pr_w2v2ph

defaults:
  - override /logger: csv
  - override /data: buckeye
  - model: powsm_pr # do not matter, only to satisfy requirement. inference runner is set to wav2vec2-phoneme
  - model/net: powsm # do not matter, only to satisfy requirement

task_name: "inf_buckeye_pr_w2v2ph"
tags: ["inf_buckeye_pr_w2v2ph"]

seed: 42

train: false
test: false
distributed_predict: True

data:
  tokenizer:
    _target_: src.core.ipa_utils.IPATokenizer
  mask_probability: 0.0

inference:
  num_workers: 15 # number of parallel workers for distributed inference
  passthrough_keys: ["target_text","utt_id", "split"] # keys from dataset to be passed to output
  out_file: ${paths.output_dir}/buckeye_w2v2ph_${data.mask_probability}.json
  inference_runner:
    _target_: src.model.wav2vec2phoneme.builders.build_wav2vec2phoneme_inference
    hf_repo: ???