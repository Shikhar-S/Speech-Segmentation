# @package _global_

# This config executes phoneme recognition inference with wav2vec2-phoneme
# python src/main.py experiment=inference/pr_w2v2ph

defaults:
  - override /logger: csv
  - override /data: vaani_geolocation
  - override /model: null
  - override /model/net: null

task_name: "pr_w2v2ph"
tags: ["pr_w2v2ph"]

seed: 42

train: false
test: false
distributed_predict: True

inference:
  num_workers: 1 # number of parallel workers for distributed inference
  passthrough_keys: ["latitude","longitude", "split", "metadata_idx"] # keys from dataset to be passed to output
  out_file: ${paths.output_dir}/pr_w2v2ph.json
  inference_runner:
    _target_: src.model.wav2vec2phoneme.builders.build_wav2vec2phoneme_inference
    hf_repo: ???