# @package _global_
# English MFA topline: per-utterance text-dependent forced alignment using GT
# phones from the dataset (no recognizer). Override data.hf_repo at the CLI:
#   python src/main.py experiment=inference/topline_mfa_en \
#       data.hf_repo=changelinglab/timit-segment
defaults:
  - override /data: segmentation_phonvec
  - override /logger: csv
  - override /model: null
  - override /model/net: null

task_name: "inf_topline_mfa_en"
tags: ["mfa", "topline", "inference"]

train: false
test: false
distributed_predict: True

data:
  hf_repo: changelinglab/timit-segment
  predict_split: test

inference:
  num_workers: 16
  batch_size: 1
  limit_samples: null
  out_file: ${paths.output_dir}/topline_mfa_en.jsonl
  passthrough_keys:
    - utt_id
    - phone_timestamps
    - phones
    - split
  inference_runner:
    _target_: src.model.mfa.inference_baseline.build_mfa_single_inference
    dictionary: english_mfa
    acoustic_model: english_mfa
    sr: 16000
    cache_dir: ${paths.cache_dir}/mfa
    phone_normalizer: english_mfa
    recognizer: null
