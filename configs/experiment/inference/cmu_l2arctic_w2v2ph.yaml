# @package _global_

# This config executes inference with wav2vec2-phoneme on CMU L2Arctic + CMU dataset for L1 classification:
# python src/main.py experiment=inference/cmu_l2arctic_w2v2ph

defaults:
  - override /logger: csv
  - override /data: cmu_l2arctic_l1
  - override /model: null
  - override /model/net: null
# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

task_name: "cmu_l2arctic_w2v2ph"
tags: ["cmu_l2arctic_w2v2ph"]

seed: 42

distributed_predict: True

inference:
  num_workers: 1 # number of parallel workers for distributed inference
  passthrough_keys: ["l1_label", "metadata_idx", "speaker_id", "split", "utt_id"]
  out_file: ${paths.output_dir}/cmu_l2arctic_w2v2ph_out.json
  # an object (or fn that creates such an object) with __call__ method to transcribe single speech
  inference_runner:
    _target_: src.model.wav2vec2phoneme.builders.build_wav2vec2phoneme_inference
    hf_repo: facebook/wav2vec2-lv-60-espeak-cv-ft
    # facebook/wav2vec2-lv-60-espeak-cv-ft
    # facebook/wav2vec2-xlsr-53-espeak-cv-ft
    # ctaguchi/wav2vec2-large-xlsr-japlmthufielta-ipa1000-ns
    device: cuda # auto, cpu, cuda

