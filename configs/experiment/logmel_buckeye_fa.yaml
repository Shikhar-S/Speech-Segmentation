# @package _global_

# to execute this experiment run:
# python src/main.py experiment=logmel_buckeye_fa

defaults:
  - override /data: buckeye
  - override /model: forced_alignment
  - override /model/net: logmel
  - override /data/tokenizer: IPA
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: wandb

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

task_name: "logmel_buckeye_fa"
tags: ["logmel_buckeye_fa"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 10
  gradient_clip_val: 1.0
  val_check_interval: 0.25 # validate 4 times per epoch
  callbacks:
    - learning_rate_monitor

model:
  optimizer:
    lr: 0.0002
  net:
    hop_length: 160
    hidden_sizes: []
    output_vocabsz:
      _target_: src.data.buckeye.forced_alignment.IPATokenizer.vocab_size

data:
  batch_size: 24

logger:
  wandb:
    tags: ${tags}
    group: "logmel_buckeye_fa"
  aim:
    experiment: "logmel_buckeye_fa"