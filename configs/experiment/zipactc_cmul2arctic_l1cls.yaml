# @package _global_

# to execute this experiment run:
# python src/main.py experiment=zipactc_cmul2arctic_l1cls

defaults:
  - override /data: cmu_l2arctic_l1
  - override /model: classification
  - override /model/head: transformer
  - override /model/net: zipactc
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: wandb

task_name: "zipactc_cmul2arctic_l1cls"
tags: ["zipactc","cmul2arctic","l1cls"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 10
  gradient_clip_val: 1.0
  val_check_interval: 0.25 # validate 4 times per epoch
  callbacks:
    - learning_rate_monitor

model:
  freeze_encoder: true
  optimizer:
    lr: 0.0002

data:
  batch_size: 48 # 48 on delta-ai, 24 on delta (1gpu)

logger:
  wandb:
    tags: ${tags}
    group: "zipactc_cmul2arctic_l1cls"