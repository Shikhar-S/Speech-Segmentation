# @package _global_

# L1 Classification experiment with POWSM encoder
# To execute this experiment run:
# python src/main.py experiment=powsm_l1_classification

defaults:
  - override /model: l1_classification
  - override /model/net: powsm
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: wandb

# TODO: Add data config once L1 classification dataset is prepared
# - override /data: l1_classification
# - override /data/tokenizer: ...

task_name: "powsm_l1_classification"
tags: ["powsm", "l1_classification"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 50
  gradient_clip_val: 1.0
  val_check_interval: 0.25  # validate 4 times per epoch

model:
  num_classes: ???  # Must be specified based on dataset
  freeze_encoder: true
  optimizer:
    lr: 0.0001

# TODO: Add data config
# data:
#   batch_size: 32

logger:
  wandb:
    tags: ${tags}
    group: "l1_classification"

