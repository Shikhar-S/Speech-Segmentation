# @package _global_

defaults:
  - override /data: null
  - override /model: phone_recognition
  - override /model/net: xeuspr
  - override /trainer: ddp
  - override /callbacks: default
  - override /logger: wandb

task_name: train_timit_xeuspr_epitran_mix
tags: ["timit", "xeuspr", "phone_recognition", "epitran_mix"]

seed: 42

trainer:
  devices: -1  # use all available GPUs
  strategy: ddp_find_unused_parameters_true
  min_epochs: 0
  max_epochs: -1
  max_steps: 30000
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  val_check_interval: 1000
  check_val_every_n_epoch: null
  log_every_n_steps: 100

data:
  _target_: src.data.timit.pr_datamodule.TimitPRDataModule
  timit_root: ${paths.download_dir}/TIMIT/timit_nltk
  local_cache_path: ${paths.cache_dir}/timit
  vocab_file: ${model.net.vocab_file}
  batch_size: 32
  num_workers: 8
  pin_memory: True
  target_sr: 16000
  max_speech_length: null
  epitran_mix_ratio: 0.3   # ~30% of train examples use Epitran labels
  epitran_lang: "eng-Latn"

model:
  dev_splits: ["val"]
  optimizer:
    lr: 0.00005
  scheduler:
    _target_: src.recipe.phone_recognition.model_module.get_w2v2ph_schedule
    _partial_: true
    num_training_steps: ${trainer.max_steps}
    encoder_unfreeze_step: 10000

callbacks:
  model_checkpoint:
    monitor: null
    auto_insert_metric_name: False
    mode: "min" # dummy
    save_top_k: -1
    filename: "checkpoint-{step}"
    save_last: True
    every_n_epochs: null
    every_n_train_steps: ${trainer.val_check_interval}
  early_stopping: null
  learning_rate_monitor:
    logging_interval: "step"

logger:
  wandb:
    tags: ${tags}
    group: ${task_name}
    project: "SSLPR"

