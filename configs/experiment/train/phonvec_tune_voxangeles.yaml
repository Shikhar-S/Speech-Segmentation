# @package _global_
# python -m src.recipe.phonvec.train experiment=train/phonvec_tune_voxangeles
#
# Cross-dataset tuning: fits PhonologicalVectors on TIMIT (train minus the
# carved-out 'tune' subset) and tunes hyperparameters on the VoxAngeles
# 'tune' subset (notebook seed-50 second-1000-of-2000).
defaults:
  - override /data: segmentation_phonvec
  - override /logger: csv
  - override /model: null
  - override /model/net: null

task_name: "tune_phonvec_voxangeles"
tags: ["phonvec", "tune", "voxangeles"]

train: false
test: false
distributed_predict: false

# This is the data to fit phonological vectors
data:
  hf_repo: changelinglab/timit-segment

phonvec_tune:
  device: cuda
  tolerance_ms: 20
  strip_outer_silences: false  # voxangeles GT has no h#/pau bookends
  silence_detector_path: exp/data/phonological_vector/logistic_regression_silence_detector.joblib
  frame_shift: 320
  sr: 16000
  mel_frame_shift_ms: 10
  net:
    _target_: src.model.wavlm.builders.build_wavlm_model
    hf_repo: microsoft/wavlm-large
    encoder_layer: 24
    cache_dir: ${paths.cache_dir}/hf
  # Dataset for tuning, a transform will create the 'tune' split from the registered voxangeles splits
  tune_data:
    _target_: src.data.segmentation.segmentation_dataset.SegmentationDataModule
    hf_repo: changelinglab/voxangeles-segment
    tokenizer:
      _target_: src.data.segmentation.segmentation_dataset.DummyTokenizer
    batch_size: 1
    num_workers: 4
    pin_memory: true
    target_sr: 16000
  grid:
    drop_k: [0, 1, 2, 3]
    norm_method: [min, minmax]
    prominence: [0.001]
    snap_silence: [true]
  out_artifact: ${paths.output_dir}/phonvec_voxangeles.pt
