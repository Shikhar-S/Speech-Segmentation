# @package _global_

# export HF_HOME="exp/cache/hf"
# python src/main.py experiment=train/ipapack_accent_xeusctc trainer.max_steps=100 trainer.val_check_interval=10 run_folder=test

# sbatch -c 36 --ntasks-per-node=2 --gpus-per-node=2 --mem=240G scripts/daixpr.batch run_folder=CHANGE experiment=train/ipapack_accent_xeusctc trainer.accumulate_grad_batches=8 model.optimizer.lr=0.0001


defaults:
  - override /data: null # defined below
  - override /model: phone_recognition
  - override /model/net: xeuspr
  - override /trainer: ddp
  - override /callbacks: default
  - override /logger: wandb

task_name: ipaaccent_xeus
tags: ["ipapack", "xeusctc", "phone_recognition", "accentmix"]

seed: 42

trainer:
  devices: -1  # use all available GPUs
  strategy: ddp_find_unused_parameters_true
  min_epochs: 0
  max_epochs: -1
  max_steps: 100000
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  val_check_interval: 3000
  check_val_every_n_epoch: null
  log_every_n_steps: 200

data:
  _target_: src.data.kaldi_pretraining_dataset.build_kaldi_datamodule
  train_splits: ["train_accentmix_en"]
  dev_splits: ["dev_indom1k_accentmix_en"]
  dataset_config_path: configs/data/ipapack_index.yaml
  vocab_file: ${model.net.vocab_file}
  batch_size: 16
  num_workers: 12

model:
  dev_splits: ${data.dev_splits}
  optimizer:
    lr: 0.00005
  scheduler:
    _target_: src.recipe.phone_recognition.model_module.get_w2v2ph_schedule
    _partial_: true
    num_training_steps: ${trainer.max_steps}
    encoder_unfreeze_step: 0
    warmup_fraction: 0.0
    constant_fraction: 1.0

callbacks:
  model_checkpoint:
    monitor: null
    auto_insert_metric_name: False
    mode: "min" # dummy
    save_top_k: -1
    filename: "checkpoint-{step}"
    save_last: True
    every_n_epochs: null
    every_n_train_steps: ${trainer.val_check_interval} 
  early_stopping: null
  learning_rate_monitor:
    logging_interval: "step"

logger:
  wandb:
    tags: ${tags}
    group: ${task_name}
    project: "SSLPR"
    name: ${run_folder}