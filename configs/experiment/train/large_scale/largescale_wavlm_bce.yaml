# @package _global_
# Large-scale BCE-only WavLM (Round 5 companion).
# BCE boundary supervision on cv-v1.0 + librispeech + thchs30 segment corpora.
# No CountCTC head, no tying. Isolates the value of scaling 3-corpus BCE.
# Validation: changelinglab/timit-segment val (val_seg/rval), comparable to all
# Round 4 WavLM baselines and the tied joint companion run.

defaults:
  - override /data: joint_prseg
  - override /model: segment_recognize_bare
  - override /model/net: wavlm
  - override /trainer: ddp
  - override /callbacks: default
  - override /logger: wandb

task_name: "largescale_wavlm_bce"
tags: ["wavlm", "segment_recognize", "large_scale",
       "cv", "librispeech", "thchs30", "bce"]

seed: 42
test: False

trainer:
  devices: -1
  strategy: ddp_find_unused_parameters_true
  max_steps: 254000              # 5 epochs over 4.88M items at BS=24×4 GPUs (BS reduced after OOM @BS=40 with Adam state)
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  val_check_interval: 1000
  log_every_n_steps: 100

callbacks:
  log_global_step:
    _target_: src.core.callbacks.log_global_step.LogGlobalStep
  model_checkpoint:
    monitor: global_step
    mode: max
    every_n_train_steps: 5000
    save_top_k: 5
    filename: step_{step:06d}
    save_last: true
  early_stopping: null

model:
  audio_sr: 16000
  optimizer:
    lr: 0.0001
  net:
    hf_repo: microsoft/wavlm-large
    output_vocabsz: 428
    vocab_file: src/model/xeusphoneme/resources/ipa_vocab.json
    freeze_encoder: false
  seg_losses:
    bce:
      _target_: src.recipe.segment_recognize.heads.bce_boundary.BCEBoundaryHead
      _partial_: true
      weight: 1.0
      pos_weight: 1.0

data:
  batch_size: 24                 # OOM @BS=40 (Adam state + bf16 master copy overhead vs SGD probe)
  num_workers: 8
  train_datasets:
    segmentation:
      - - _target_: src.data.segmentation.segmentation_dataset.build_segmentation_dataset
          hf_repo: exp/downloads/cv-aligned-seg
          split: train
          tokenizer:
            _target_: src.model.xeusphoneme.builders.XeusPRTokenizer
            vocab_file: src/model/xeusphoneme/resources/ipa_vocab.json
          target_sr: 16000
          max_speech_length: 20
        - 1.0
      - - _target_: src.data.segmentation.segmentation_dataset.build_segmentation_dataset
          hf_repo: exp/downloads/librispeech-mfa-seg
          split: train
          tokenizer:
            _target_: src.model.xeusphoneme.builders.XeusPRTokenizer
            vocab_file: src/model/xeusphoneme/resources/ipa_vocab.json
          target_sr: 16000
          max_speech_length: 20
        - 1.0
      - - _target_: src.data.segmentation.segmentation_dataset.build_segmentation_dataset
          hf_repo: exp/downloads/thchs30-seg
          split: train
          tokenizer:
            _target_: src.model.xeusphoneme.builders.XeusPRTokenizer
            vocab_file: src/model/xeusphoneme/resources/ipa_vocab.json
          target_sr: 16000
          max_speech_length: 20
        - 1.0
  validation_datasets:
    segmentation:
      - _target_: src.data.segmentation.segmentation_dataset.build_segmentation_dataset
        hf_repo: changelinglab/timit-segment
        split: val
        tokenizer:
          _target_: src.model.xeusphoneme.builders.XeusPRTokenizer
          vocab_file: src/model/xeusphoneme/resources/ipa_vocab.json
        target_sr: 16000
        max_speech_length: 8

logger:
  wandb:
    tags: ${tags}
    group: ${task_name}
