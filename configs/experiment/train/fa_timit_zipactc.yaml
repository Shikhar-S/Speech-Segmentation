# @package _global_

# to execute this experiment run:
# python src/main.py experiment=probing/fa_timit_zipactc

defaults:
  - override /data: timit
  - override /model: segmentation
  - override /model/net: zipactc
  - override /data/tokenizer: zipactc
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: wandb

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

task_name: "fa_timit_zipactc"
tags: ["timit", "zipactc", "fa"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 10
  gradient_clip_val: 1.0
  val_check_interval: 0.25 # validate 4 times per epoch
  callbacks:
    - learning_rate_monitor

model:
  optimizer:
    lr: 0.0002

data:
  batch_size: 48

logger:
  wandb:
    tags: ${tags}
    group: "fa_timit_zipactc"
  aim:
    experiment: "fa_timit_zipactc"  