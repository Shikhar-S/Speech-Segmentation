# @package _global_

# Forced alignment on TIMIT using WavLM encoder + IPA CTC head
#
# To execute this experiment run:
# python src/main.py experiment=probing/fa_timit_wavlm

defaults:
  - override /data: timit
  - override /model: segmentation
  - override /model/net: wavlm
  - override /data/tokenizer: IPA
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: wandb

task_name: "fa_timit_wavlm"
tags: ["timit", "wavlm", "fa"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 10
  gradient_clip_val: 1.0
  val_check_interval: 0.25 # validate 4 times per epoch
  callbacks:
    - learning_rate_monitor

model:
  optimizer:
    lr: 0.0002
  net:
    hf_repo: microsoft/wavlm-base
    output_vocabsz:
      _target_: src.core.ipa_utils.IPATokenizer.vocab_size
    freeze_encoder: true

data:
  batch_size: 24

logger:
  wandb:
    tags: ${tags}
    group: "fa_timit_wavlm"
  aim:
    experiment: "fa_timit_wavlm"
