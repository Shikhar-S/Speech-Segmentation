# @package _global_

# python src/main.py experiment=train/fleurs_xeuspr

defaults:
  - override /data: fleurs
  - override /data/tokenizer: char
  - override /model: phone_recognition
  - override /model/net: xeuspr
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: tensorboard

task_name: "train_fleurs_xeuspr"
tags: ["fleurs", "xeuspr", "phone_recognition"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 50
  gradient_clip_val: 1.0
  val_check_interval: 0.25  # validate 4 times per epoch

data:
  id_to_label: ["en_us"]  # FLEURS-1 (English US)
  num_classes: 1
  batch_size: 24
  tokenizer:
    vocab_path: exp/cache/envocab.json

model:
  freeze_encoder: true
  optimizer:
    lr: 0.001

logger:
  wandb:
    tags: ${tags}
    group: "train_fleurs_xeuspr"