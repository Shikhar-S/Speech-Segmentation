# @package _global_

# CTC only on TIMIT with WavLM (16 kHz)

defaults:
  - override /data: joint_prseg
  - override /model: segment_recognize_bare
  - override /model/net: wavlm

  - override /trainer: ddp
  - override /callbacks: default
  - override /logger: wandb

task_name: "timit_wavlm_ctc"
tags: ["wavlm", "segment_recognize", "timit", "sr16k", "ctc"]

seed: 42
test: False

trainer:
  devices: -1
  strategy: ddp_find_unused_parameters_true
  min_epochs: 0
  max_epochs: -1
  max_steps: 25000
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  val_check_interval: 250
  check_val_every_n_epoch: null
  log_every_n_steps: 100

callbacks:
  model_checkpoint:
    monitor: val_seg/rval
    mode: max
    filename: step_{step:06d}
    save_last: true
  early_stopping:
    monitor: val_seg/rval
    mode: max
    patience: 100

model:
  audio_sr: 16000
  optimizer:
    lr: 0.0001
  net:
    hf_repo: microsoft/wavlm-large
    output_vocabsz: 428
    freeze_encoder: false
  # CTC is the segmentation training signal here, so the head lives under
  # seg_losses (consumes the seg sub-batch, which has boundary GT for rval).
  seg_losses:
    ctc:
      _target_: src.recipe.segment_recognize.heads.ctc_recognition.CTCRecognitionHead
      _partial_: true
      weight: 1.0
      tolerance_ms: 20

data:
  batch_size: 8
  train_datasets:
    segmentation:
      - - _target_: src.data.segmentation.segmentation_dataset.build_segmentation_dataset
          hf_repo: changelinglab/timit-segment
          split: train
          tokenizer:
            _target_: src.model.xeusphoneme.builders.XeusPRTokenizer
            vocab_file: src/model/xeusphoneme/resources/ipa_vocab.json
          target_sr: 16000
          max_speech_length: 8
        - 1.0
  validation_datasets:
    segmentation:
      - _target_: src.data.segmentation.segmentation_dataset.build_segmentation_dataset
        hf_repo: changelinglab/timit-segment
        split: val
        tokenizer:
          _target_: src.model.xeusphoneme.builders.XeusPRTokenizer
          vocab_file: src/model/xeusphoneme/resources/ipa_vocab.json
        target_sr: 16000
        max_speech_length: 8

logger:
  wandb:
    tags: ${tags}
