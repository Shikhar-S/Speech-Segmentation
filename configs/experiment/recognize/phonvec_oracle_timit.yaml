# @package _global_
# Oracle-boundary phonvec recognition: the ground-truth segment boundaries
# (phone_timestamps) drive the recognizer instead of the model segmenter. Score with
# scripts/eval_recognition.py, which reads the GT `phones` as the reference.
#
# Build the per-language vocab first (segment-derived, for the ablation):
#   PYTHONPATH=. python scripts/build_phonvec_vocab_segment.py \
#       changelinglab/timit-segment configs/inference/phonvec_vocab/timit_segment.json
#
# Run:
#   python src/main.py experiment=recognize/phonvec_oracle_timit \
#       inference.inference_runner.model_name_or_path=juice500/wavlm-24-phonemodel
defaults:
  - override /data: segmentation_phonvec
  - override /logger: csv
  - override /model: null
  - override /model/net: null

task_name: "inf_phonvec_oracle_timit"
tags: ["phonvec", "oracle", "recognition", "inference"]

train: false
test: false
distributed_predict: True

data:
  hf_repo: ${oc.env:SEG_REPO_TIMIT,changelinglab/timit-segment}
  predict_split: "test"

inference:
  num_workers: 2
  limit_samples: null
  out_file: ${paths.output_dir}/phonvec_oracle.jsonl
  passthrough_keys:
    - "utt_id"
    - "phone_timestamps"
    - "phones"
    - "language"
    - "split"
  inference_runner:
    _target_: src.model.phonvec.inference.build_phonvec_inference
    model_name_or_path: ??? # HuggingFace repo id or local path
    oracle: true
    # Per-language vocab JSON built from the segment dataset's `phones`
    # (scripts/build_phonvec_vocab_segment.py). null ⇒ open-vocab decode.
    vocab_file: configs/inference/phonvec_vocab/timit_segment.json
