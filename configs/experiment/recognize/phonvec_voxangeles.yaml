# @package _global_
# Phonvec PR inference on voxangeles with per-language vocab routing.
# Vocab JSON was precomputed via:
#   PYTHONPATH=. python scripts/build_phonvec_vocab.py voxangeles \
#       configs/inference/phonvec_vocab/voxangeles.json
# Override the encoder at the CLI:
#   python src/main.py experiment=recognize/phonvec_voxangeles \
#       inference.inference_runner.model_name_or_path=juice500/wavlm-12-phonemodel
defaults:
  - /experiment/recognize/phonvec
  - _self_

data:
  dataset_name: voxangeles

inference:
  inference_runner:
    vocab_file: configs/inference/phonvec_vocab/voxangeles.json
