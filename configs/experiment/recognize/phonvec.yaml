# @package _global_
# Phonvec inference on Kaldi-format prism_preval datasets.
# Override data.dataset_name at the CLI:
#   python src/main.py experiment=recognize/phonvec \
#       data.dataset_name=timit \
#       inference.inference_runner.model_name_or_path=juice500/wavlm-24-phonemodel
defaults:
  - override /data: prism_preval
  - override /logger: csv
  - override /model: null
  - override /model/net: null

task_name: "inf_phonvec"
tags: ["phonvec", "inference", "kaldi"]

train: false
test: false
distributed_predict: True

inference:
  num_workers: 4
  limit_samples: null
  out_file: ${paths.output_dir}/${data.dataset_name}_phonvec.jsonl
  passthrough_keys:
    - "key"
    - "utt_id"
    - "text"
    - "wavpath"
    - "lang_sym"
    - "split"
  inference_runner:
    _target_: src.model.phonvec.inference.build_phonvec_inference
    model_name_or_path: ??? # HuggingFace repo id or local path
    device: cuda
    # Path to a per-language vocab JSON (output of scripts/build_phonvec_vocab.py).
    # null ⇒ decode with the model's IPA-view featmap (no per-utt routing).
    vocab_file: null
