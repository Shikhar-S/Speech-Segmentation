# @package _global_
# Phonvec PR inference on doreco with per-language vocab routing.
# Vocab JSON was precomputed via:
#   PYTHONPATH=. python scripts/build_phonvec_vocab.py doreco \
#       configs/inference/phonvec_vocab/doreco.json
# Override the encoder at the CLI:
#   python src/main.py experiment=recognize/phonvec_doreco \
#       inference.inference_runner.model_name_or_path=juice500/wavlm-12-phonemodel
defaults:
  - /experiment/recognize/phonvec
  - _self_

data:
  dataset_name: doreco

inference:
  inference_runner:
    vocab_file: configs/inference/phonvec_vocab/doreco.json
