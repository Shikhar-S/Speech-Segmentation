# @package _global_
# Phonvec PR inference on timit with per-language vocab routing.
# Vocab JSON was precomputed via:
#   PYTHONPATH=. python scripts/build_phonvec_vocab.py timit \
#       configs/inference/phonvec_vocab/timit.json
# Override the encoder at the CLI:
#   python src/main.py experiment=recognize/phonvec_timit \
#       inference.inference_runner.model_name_or_path=juice500/wavlm-12-phonemodel
defaults:
  - /experiment/recognize/phonvec
  - _self_

data:
  dataset_name: timit

inference:
  inference_runner:
    vocab_file: configs/inference/phonvec_vocab/timit.json
