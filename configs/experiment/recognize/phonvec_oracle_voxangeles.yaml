# @package _global_
# Oracle-boundary phonvec recognition on voxangeles-segment (multilingual,
# per-language vocab routing keyed by the row `language`).
# Vocab JSON precomputed via:
#   PYTHONPATH=. python scripts/build_phonvec_vocab_segment.py \
#       changelinglab/voxangeles-segment configs/inference/phonvec_vocab/voxangeles_segment.json
#   python src/main.py experiment=recognize/phonvec_oracle_voxangeles \
#       inference.inference_runner.model_name_or_path=juice500/wavlm-12-phonemodel
defaults:
  - /experiment/recognize/phonvec_oracle_timit
  - _self_

task_name: "inf_phonvec_oracle_voxangeles"

data:
  hf_repo: ${oc.env:SEG_REPO_VOXANGELES,changelinglab/voxangeles-segment}

inference:
  inference_runner:
    vocab_file: configs/inference/phonvec_vocab/voxangeles_segment.json
