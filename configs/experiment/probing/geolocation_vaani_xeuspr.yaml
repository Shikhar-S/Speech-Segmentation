# @package _global_

# to execute this experiment run:
# python src/main.py experiment=probing/geolocation_vaani_xeuspr

defaults:
  - override /data: vaanigeo
  - override /model: classification
  - override /model/head: attnmlp
  - override /model/net: xeuspr
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: wandb

task_name: "geolocation_vaani_xeuspr"
tags: ["vaani", "xeuspr", "geo_in"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 100
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2 # eff bs 48, same as others!
  val_check_interval: 0.25 # validate 4 times per epoch
  callbacks:
    - learning_rate_monitor

callbacks:
  model_checkpoint:
    monitor: "val/err_km"
    mode: "min"
    save_top_k: 1
  early_stopping:
    monitor: "val/err_km"
    mode: "min"
    patience: 10

model:
  net:
    checkpoint: exp/runs/train_ipapack_xeuspr/20251225_221757/checkpoints/step_030000.ckpt
  head:
    task_type: "geolocation"
  freeze_encoder: true
  optimizer:
    lr: 0.0002
  scheduler:
    total_iters: 200

data:
  batch_size: 24

logger:
  wandb:
    tags: ${tags}
    group: ${task_name}
    name: ${task_name}