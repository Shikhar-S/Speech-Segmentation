# @package _global_

# to execute this experiment run:
# python src/main.py experiment/probing=w2v2ph_buckeye_fa

defaults:
  - override /data: buckeye
  - override /model: forced_alignment
  - override /model/net: w2v2ph
  - override /data/tokenizer: w2v2ph
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: wandb

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

task_name: "w2v2ph_buckeye_fa"
tags: ["w2v2ph_buckeye_fa"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 10
  gradient_clip_val: 1.0
  val_check_interval: 0.25 # validate 4 times per epoch
  callbacks:
    - learning_rate_monitor

model:
  optimizer:
    lr: 0.0002
  # freeze_encoder: true TODO(shikhar): implement (?)

data:
  batch_size: 24
  tokenizer:
    hf_repo: ???

logger:
  wandb:
    tags: ${tags}
    group: "w2v2ph_buckeye_fa"
  aim:
    experiment: "w2v2ph_buckeye_fa"