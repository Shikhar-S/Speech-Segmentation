# @package _global_

# L1 Classification experiment using IPA text (text embedding mode)
# Uses pre-extracted IPA transcripts from JSON files (e.g., PoWSM or Wav2Vec2Phoneme output)
#
# To execute this experiment run:
# python src/main.py experiment/probing=phoneme_ipa_l1_classification
#
# To use different IPA sources, override data.json_path:
# python src/main.py experiment/probing=phoneme_ipa_l1_classification \
#   data.json_path=/path/to/cmu_l2arctic_w2v2ph_out.json

defaults:
  - override /data: cmu_l2arctic_ipa
  - override /model: l1_classification
  - override /model/net: ipa_embedding
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: wandb

task_name: "phoneme_ipa_l1_classification"
tags: ["ipa", "l1_classification"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 50
  gradient_clip_val: 1.0
  val_check_interval: 0.25  # validate 4 times per epoch

data:
  json_path: ${paths.data_dir}/l1/cmu_l2arctic_powsm_out.json
  batch_size: 64
  num_workers: 4

model:
  input_type: "ipa"  # Use IPA text input mode
  freeze_encoder: false  # IPA embedding is trainable
  encoder_output_dim: 128  # Must match ipa_embedding.embedding_dim
  optimizer:
    lr: 0.001
  # Override net config to set vocab_size
  # Note: vocab_size will be determined dynamically from the datamodule
  # For now, set a reasonable upper bound (can be overridden)
  net:
    vocab_size: 200
    embedding_dim: 128

logger:
  wandb:
    tags: ${tags}
    group: "l1_classification"






