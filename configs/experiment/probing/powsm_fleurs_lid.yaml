# @package _global_

# Fleurs Langid experiment with POWSM encoder
# To execute this experiment run:
# python src/main.py experiment/probing=powsm_fleurs_lid

defaults:
  - override /data: fleurs
  - override /model: classification
  - override /model/head: attnmlp
  - override /model/net: powsm
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: wandb

# TODO(shikhar): add a nesting level to separate out experiment 
# configs for probing, cascade, inference

task_name: "powsm_fleurs_lid"
tags: ["powsm",'fleurs' ,"lid"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 50
  gradient_clip_val: 1.0
  val_check_interval: 0.25  # validate 4 times per epoch

data:
  batch_size: 48

model:
  freeze_encoder: true
  optimizer:
    lr: 0.0001

logger:
  wandb:
    tags: ${tags}
    group: "lid"