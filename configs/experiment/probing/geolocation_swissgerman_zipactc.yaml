# @package _global_

# to execute this experiment run:
# python src/main.py experiment=probing/geolocation_swissgerman_zipactc

defaults:
  - override /data: swissgermangeo
  - override /model: geolocation
  - override /model/net: zipactc
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: wandb

task_name: "geolocation_swissgerman_zipactc"
tags: ["swissgerman", "zipactc", "geolocation"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 10
  gradient_clip_val: 1.0
  val_check_interval: 0.25 # validate 4 times per epoch
  callbacks:
    - learning_rate_monitor

model:
  optimizer:
    lr: 0.0002

data:
  batch_size: 24 # 48 on delta-ai, 24 on delta (1gpu)

logger:
  wandb:
    tags: ${tags}
    group: ${task_name}
    name: ${task_name}