# @package _global_

# to execute this experiment run:
# python src/main.py experiment/probing=powsm_vaani_geolocation

defaults:
  - override /data: vaani_geolocation
  - override /model: geolocation
  - override /model/net: powsm
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: wandb

task_name: "powsm_vaani_geolocation"
tags: ["powsm_vaani_geolocation"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 10
  gradient_clip_val: 1.0
  val_check_interval: 0.25 # validate 4 times per epoch
  callbacks:
    - learning_rate_monitor

model:
  optimizer:
    lr: 0.0002

data:
  batch_size: 48 # 48 on delta-ai, 24 on delta (1gpu)

logger:
  wandb:
    tags: ${tags}
    group: "powsm_vaani_geolocation"
  aim:
    experiment: "powsm_vaani_geolocation"