# @package _global_

# L1 Classification experiment with POWSM encoder
# To execute this experiment run:
# python src/main.py experiment=probing/l1cls_cmul2arctic_powsm

defaults:
  - override /data: cmu_l2arctic_l1
  - override /model: classification
  - override /model/head: transformer
  - override /model/net: powsm
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: wandb

# TODO(shikhar): add a nesting level to separate out experiment 
# configs for probing, cascade, inference

task_name: "l1cls_cmul2arctic_powsm"
tags: ["cmu_l2arctic", "powsm", "l1cls"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 50
  gradient_clip_val: 1.0
  val_check_interval: 0.25  # validate 4 times per epoch

data:
  batch_size: 48

model:
  freeze_encoder: true
  optimizer:
    lr: 0.0001

logger:
  wandb:
    tags: ${tags}
    group: "l1cls_cmul2arctic_powsm"