# @package _global_
defaults:
  - override /data: timit
  - override /model: forced_alignment
  - override /model/net: powsm_ctc_vr
  - override /data/tokenizer: powsm
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: wandb

task_name: "fa_timit_powsmvr"
tags: ["timit", "powsmvr", "fa"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 10
  gradient_clip_val: 1.0
  val_check_interval: 0.25 # validate 4 times per epoch
  callbacks:
    - learning_rate_monitor

model:
  optimizer:
    lr: 0.0002

data:
  batch_size: 32

logger:
  wandb:
    tags: ${tags}
    group: ${task_name}
  aim:
    experiment: ${task_name}  