# @package _global_

# L2 Assessment experiment with POWSM encoder
# To execute this experiment run:
# python src/main.py experiment=probing/l2as_speechocean_powsm

defaults:
  - override /data: speechocean
  - override /model: classification
  - override /model/head: attnmlp
  - override /model/net: powsm
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: wandb

task_name: "l2as_speechocean_powsm"
tags: ["speechocean", "powsm", "l2as"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 100
  gradient_clip_val: 1.0
  val_check_interval: 0.25  # validate 4 times per epoch

data:
  batch_size: 48

model:
  freeze_encoder: true
  optimizer:
    lr: 0.0001

logger:
  wandb:
    tags: ${tags}
    group: "l2as_speechocean_powsm"