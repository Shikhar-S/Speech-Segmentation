# @package _global_

# Fleurs Langid experiment with POWSM encoder
# To execute this experiment run:
# python src/main.py experiment=probing/lid_fleurs_zipactc

defaults:
  - override /data: fleurs
  - override /model: classification
  - override /model/head: attnmlp
  - override /model/net: zipactc
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: wandb

task_name: "lid_fleurs_zipactc"
tags: ["fleurs", "zipactc", "lid"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 50
  gradient_clip_val: 1.0
  val_check_interval: 0.25  # validate 4 times per epoch

data:
  batch_size: 48

model:
  freeze_encoder: true
  optimizer:
    lr: 0.0001

logger:
  wandb:
    tags: ${tags}
    group: "lid_fleurs_zipactc"