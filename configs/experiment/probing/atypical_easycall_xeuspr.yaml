# @package _global_

# To execute this experiment run:
# python src/main.py experiment=probing/atypical_easycall_xeuspr

defaults:
  - override /data: easycall
  - override /model: classification
  - override /model/head: attnmlp
  - override /model/net: xeuspr
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: wandb

task_name: "atypical_easycall_xeuspr"
tags: ["easycall", "xeuspr", "atypical", "regression"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 25
  accumulate_grad_batches: 2 # eff bs 48, same as others!
  gradient_clip_val: 1.0
  val_check_interval: 0.25  # validate 4 times per epoch


model:
  net:
    checkpoint: exp/runs/train_ipapack_xeuspr/20251225_221757/checkpoints/step_030000.ckpt
  head:
    task_type: "regression"
  freeze_encoder: true
  optimizer:
    lr: 0.0002
  scheduler:
    total_iters: 200

data:
  batch_size: 24

callbacks:
  model_checkpoint:
    monitor: "val/kendalltau"
    mode: "max"
    save_top_k: 1
  early_stopping:
    monitor: "val/kendalltau"
    patience: 5
    mode: "max"


logger:
  wandb:
    tags: ${tags}
    name: ${task_name}
