# @package _global_

# to execute this experiment run:
# python src/main.py experiment=probing/atypical_ultrasuite_zipactc

defaults:
  - override /data: ultrasuite_child
  - override /model: classification
  - override /model/head: attnmlp
  - override /model/net: zipactc
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: wandb

task_name: "atypical_ultrasuite_zipactc"
tags: ["ultrasuite", "zipactc", "atypical"]

seed: 42

trainer:
  min_epochs: 10
  max_epochs: 25
  gradient_clip_val: 1.0
  val_check_interval: 0.25 # validate 4 times per epoch
  callbacks:
    - learning_rate_monitor

model:
  freeze_encoder: true
  optimizer:
    lr: 0.0002
  scheduler:
    total_iters: 500

data:
  batch_size: 48 # 48 on delta-ai, 24 on delta (1gpu)

logger:
  wandb:
    tags: ${tags}
    group: "atypical_ultrasuite_zipactc"
