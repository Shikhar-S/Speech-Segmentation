[project]
name = "speech-segmentation"
version = "0.1.0"
requires-python = "==3.10.*"
# Core: SPAM evaluation, WavLM baselines (see extras), MFA and Koel toplines,
# scoring, and data preparation.
dependencies = [
    "torch==2.6.0",
    "torchaudio==2.6.0",
    # NVIDIA runtime libs torch's +cu126 wheel dlopens (clusters without a cudnn module)
    "nvidia-cudnn-cu12<10",
    "nvidia-cublas-cu12",
    "nvidia-cusparselt-cu12",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
    "nvidia-cusolver-cu12",
    "nvidia-cusparse-cu12",
    "nvidia-nccl-cu12",
    "nvidia-nvtx-cu12",
    "nvidia-nvjitlink-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cuda-cupti-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "lightning==2.6.0",
    "torchmetrics>=0.11.4",
    "hydra-core==1.3.2",
    "hydra-colorlog==1.2.0",
    "rootutils",
    "rich",
    "pandas",
    "transformers",
    "huggingface_hub==0.35.3",
    "datasets==3.6.0",
    "pyarrow>=24.0.0",
    "kaldiio",  # PRiSM Kaldi dumps
    "rapidfuzz==3.14.3",  # error calculator
    "panphon==0.22.2",
    "wandb==0.22.1",  # training logger
    "phone-metrics @ git+https://github.com/stephenmac7/phone-metrics@1a92237",
    "phonological-posteriogram @ git+https://github.com/juice500ml/phonespam@0d50cb2db481a2886c6369622d20714e3d3f3656",  # SPAM library as used for the paper runs (2026-06-29, pre-rename; includes the mel_svf alignment fix)
    # data preparation
    "buckeye==1.3",
    "nltk",
    "tgt",
    # development
    "pytest",
    "pytest-mock==3.15.1",
    "pre-commit",
]

[project.optional-dependencies]
# ESPnet-derived XEUS code (WavLM baselines, PhoneticXEUS topline). ESPnet itself
# is a platform-specific fork installed by setup.sh; these are its runtime deps.
x86 = [
    "humanfriendly",
    "torch-complex",
    "h5py",
    "g2p-en",
    "jamo",
    "espnet-tts-frontend",
    "jaconv",
    "scipy",
    "k2==1.24.4.dev20250715+cuda12.6.torch2.6.0",
]
dai = [
    "humanfriendly",
    "torch-complex",
    "h5py",
    "g2p-en",
    "jamo",
    "espnet-tts-frontend",
    "jaconv",
    "scipy",
]

[tool.black]
line-length = 80

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu126"]
find-links = ["https://k2-fsa.github.io/k2/cuda.html"]
index-strategy = "unsafe-best-match"
link-mode = "copy"
cache-dir = ".uv_cache"

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]
